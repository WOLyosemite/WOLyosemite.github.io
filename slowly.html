<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>把事情做慢一点 | WOLyosemite</title><link rel="stylesheet" href="../styles.css"><script src="../script.js" defer></script></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="../index.html">WOLyosemite<span>.</span></a><nav class="nav"><a href="../index.html">首页</a><a class="active" href="../index.html#articles">文章</a><a href="../about.html">关于</a><button class="theme-toggle" type="button">深色模式</button></nav></div></header><main class="post container"><p class="eyebrow">随笔 · 2026.08.12</p><h1>把事情做慢一点</h1><p class="post-lead">不追赶每一个声音，把注意力放回眼前正在做的事。</p><div class="post-body"><p>速度很容易被看见，专注却不太容易。</p><p>把事情做慢一点，并不是拒绝效率，而是给重要的事情留出足够的思考时间。少开一个页面，少切换一次任务，往往就能多看见一些原本会错过的细节。</p></div></main><footer class="site-footer"><div class="container footer-wrap"><a href="../index.html">← 返回文章列表</a><p>© 2026 WOLyosemite</p></div></footer></body></html>
